  deep-learning-api:
    build: .
    container_name: career-deep-learning-api
    command: uvicorn api.deep_learning_api:app --host 0.0.0.0 --port 8006
    ports:
      - "8006:8006"
    restart: unless-stopped

  rag-api:
    build: .
    container_name: career-rag-api
    command: uvicorn api.rag_api:app --host 0.0.0.0 --port 8007
    ports:
      - "8007:8007"
    restart: unless-stopped

  career-agent-api:
    build: .
    container_name: career-agent-api
    command: uvicorn api.career_agent_api:app --host 0.0.0.0 --port 8008
    ports:
      - "8008:8008"
    restart: unless-stopped